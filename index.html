<script>
  const image = "omar.png"; 
  const container = document.getElementById("container");
  let isLoading = false; // Flag to prevent multiple concurrent triggers

  function addOmars(count = 50) {
    isLoading = true;
    const fragment = document.createDocumentFragment(); // Performance optimization for DOM insertion
    
    for (let i = 0; i < count; i++) {
      let img = document.createElement("img");
      const width = Math.floor(Math.random() * 350) + 75;
      img.src = image;
      img.className = "omar";
      img.width = width;
      img.loading = "lazy"; // Native lazy loading to save memory
      fragment.appendChild(img);
    }
    
    container.appendChild(fragment);
    isLoading = false;
  }

  // Initial load
  addOmars(200);

  // Optimized scroll listener
  window.addEventListener("scroll", () => {
    if (isLoading) return; // Skip if we are already adding images
    
    if (window.scrollY + window.innerHeight > document.body.offsetHeight - 2000) {
      addOmars(100);
    }
  });
</script>
